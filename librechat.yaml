version: 1.3.17
cache: true
endpoints:
  custom:
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1/"
      models:
        default: ["openai/gpt-oss-120b", "openai/gpt-oss-20b"]
        fetch: false
      titleConvo: false
      modelDisplayLabel: "Groq"

mcpServers:
  cloudflare-images:
    title: "Cloudflare Images"
    description: "Generate images with FLUX.1 Schnell"
    type: stdio
    command: node
    args:
      - /app/scripts/cloudflare-images.cjs
    timeout: 150000
    env:
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID}"
